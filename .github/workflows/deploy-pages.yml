name: Deploy to GitHub Pages

# Phase 2: GitHub Pages 公開。
#
# 通常は Settings → Pages を手で操作して有効化するが、それは GUI 操作ではなく
# API 操作なので Actions から実行できる。クラウドの Claude Code セッションは
# GitHub API プロキシが /repos/*/pages を遮断するため直接は叩けないが、
# ランナーの GITHUB_TOKEN に pages: write を与えれば configure-pages が
# enablement: true で Pages 自体を有効化してくれる。
#
# ※ workflow_dispatch はデフォルトブランチに無いと使えないため、
#    main にマージするまでは作業ブランチへの push で発火させる。

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'add.html'
      - 'add-direct.html'
      - 'recs.html'
      - 'manifest.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1つだけ。進行中のデプロイは中断しない。
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Pages の初回有効化は 2026-08-09 に Settings から実施済み。
          # （GITHUB_TOKEN では作成できない＝リポジトリ管理者権限が必要なため。
          #   経緯は docs/OPERATIONS.md 参照）
          # enablement は有効化済みなら何もしないので、そのまま残しておく。
          enablement: true
          token: ${{ secrets.PAGES_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show published URL
        run: echo "公開URL ${{ steps.deployment.outputs.page_url }}"

      # 公開後のスモークテスト。クラウドの Claude Code セッションからは
      # github.io も egress ポリシーで見えないため、ここで代わりに確かめる。
      # Phase 1 で相対化したパスが実配信で効いているかまで検証する。
      - name: Verify published site
        run: |
          set -uo pipefail
          BASE="${{ steps.deployment.outputs.page_url }}"
          BASE="${BASE%/}"
          echo "検証対象: $BASE"

          # 配信が始まるまで少し待つ（最大60秒）
          for i in $(seq 1 12); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$BASE/" || echo 000)
            [ "$code" = "200" ] && break
            echo "  待機中... ($i回目 HTTP $code)"; sleep 5
          done

          fail=0
          for p in / /manifest.json /index.html /add.html /add-direct.html /recs.html; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$BASE$p" || echo 000)
            if [ "$code" = "200" ]; then echo "  ✅ $p -> $code"; else echo "  ❌ $p -> $code"; fail=1; fi
          done

          echo "--- PWAパスの実配信チェック ---"
          man=$(curl -sS "$BASE/manifest.json")
          echo "manifest: $man"
          echo "$man" | grep -q '"start_url":"\./"' \
            && echo "  ✅ start_url が相対" || { echo "  ❌ start_url が相対でない"; fail=1; }
          echo "$man" | grep -q '"scope":"\./"' \
            && echo "  ✅ scope が相対" || { echo "  ❌ scope が相対でない"; fail=1; }

          link=$(curl -sS "$BASE/" | grep -o '<link rel="manifest"[^>]*>' | head -1)
          echo "index の参照: $link"
          echo "$link" | grep -q './manifest.json' \
            && echo "  ✅ manifest 参照が相対" || { echo "  ❌ manifest 参照が絶対のまま"; fail=1; }

          [ "$fail" = "0" ] && echo "=== 検証OK ===" || { echo "=== 検証NG ==="; exit 1; }
