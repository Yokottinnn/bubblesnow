name: Daily Recommendations

# Phase 3: Make.com の日次バッチ（0:00 JST）の代替。
#
# ★現在は自動実行を止めてある★
# schedule はコメントアウトしたまま。まず workflow_dispatch を DRY_RUN=true で
# 何度か回し、生成品質を目視で確かめてから有効化する（設計書 Phase 5 の並行検証）。
# Make.com を止めるのは、それが済んでからでよい（Phase 6・要承認）。

on:
  # schedule:
  #   # 0:00 JST = 15:00 UTC（前日）。GitHub Actions の cron は UTC 基準。
  #   # 混雑時は数分〜十数分遅れることがある。
  #   - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      mode:
        # validate だけが無料。以前の dry_run は「true でも課金される」誤解を招いたので廃止した。
        description: 'validate=API呼ばず配線検証($0) / dry-run=生成のみ($0.4〜1.0) / live=生成してFirebaseに書込($0.4〜1.0)'
        type: choice
        options:
          - 'validate'
          - 'dry-run'
          - 'live'
        default: 'validate'
        required: true
      model:
        description: '使用モデル（空なら実物と同じ claude-sonnet-4-20250514）'
        type: string
        default: ''
        required: false

jobs:
  generate-recs:
    runs-on: ubuntu-latest
    env:
      # 既定は validate（APIを呼ばない＝課金なし）。schedule を有効化するときは、
      # 費用の見積もりを提示して承認を得たうえで 'live' に変えること。
      MODE: ${{ inputs.mode || 'validate' }}
      CLAUDE_MODEL: ${{ inputs.model }}
      FIREBASE_URL: ${{ secrets.FIREBASE_URL || 'https://nydaytodo-e0f20-default-rtdb.asia-southeast1.firebasedatabase.app' }}
      FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate recommendations
        run: node scripts/generate-recs.mjs

      - name: Upload backup and preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-recs-${{ github.run_number }}
          path: |
            recs-backup.json
            recs-generated-preview.json
          if-no-files-found: warn
          retention-days: 30
