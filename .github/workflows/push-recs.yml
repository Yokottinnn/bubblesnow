name: Push Recs to Firebase

# リサーチ済みレコメンドを Firebase にマージ書き込みする。
#
# クラウドの Claude Code セッションは egress ポリシーで Firebase に到達できない
# （CONNECT が 403）ため、ここを踏み台にして書き込む。詳細は docs/OPERATIONS.md。
#
# ★手動実行のみ★
# 以前は作業ブランチへの push で発火させていたが、これは本番データへの書き込みなので
# 「push したら勝手に書かれる」形は危険。main に載って workflow_dispatch が
# 使えるようになったので、明示的な手動実行だけに絞る。

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '書き込むかどうか（true=読んで結果を出すだけ / false=実際に書き込む）'
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'
        required: true

jobs:
  push-recs:
    runs-on: ubuntu-latest
    env:
      # 既定は必ず dry run。実書き込みは実行時に明示的に false を選んだ時だけ。
      DRY_RUN: ${{ inputs.dry_run || 'true' }}
      # DB URL は index.html で既に公開されている値。Secret があればそちらを優先する。
      FIREBASE_URL: ${{ secrets.FIREBASE_URL || 'https://nydaytodo-e0f20-default-rtdb.asia-southeast1.firebasedatabase.app' }}
      # 認証なしで書けている想定。必要になったら Secret を追加する。
      FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Merge researched recs into Firebase
        run: node scripts/push-recs.mjs

      - name: Upload backup and preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recs-backup-${{ github.run_number }}
          path: |
            recs-backup.json
            recs-merged-preview.json
          if-no-files-found: warn
          retention-days: 30
