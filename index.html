function extractRecs(data){
if(!data)return null;
if(Array.isArray(data)&&data.length>0&&data[0].id)return data;
try{
var obj=typeof data==="string"?JSON.parse(data):data;
if(Array.isArray(obj)&&obj.length>0&&obj[0].id)return obj;

if(obj&&obj.content&&Array.isArray(obj.content)){
for(var i=obj.content.length-1;i>=0;i--){

var txt=obj.content[i].text;
/* Remove ```json ... ``` markers */
var clean=txt.replace(/```json\s*/g,"").replace(/```\s*/g,"").trim();
/* Try parsing cleaned text directly */
try{var arr=JSON.parse(clean);if(Array.isArray(arr)&&arr.length>0)return arr;}catch(e){}
/* Try regex extraction */
var m=clean.match(/\[[\s\S]*\]/);

}}}

if(typeof obj==="string"){try{var inner=JSON.parse(obj);return extractRecs(inner);}catch(e){}}
/* Handle raw string with JSON array */
var str=typeof data==="string"?data:JSON.stringify(data);
var cleaned=str.replace(/```json\s*/g,"").replace(/```\s*/g,"");
var m3=cleaned.match(/\[[\s\S]*?\{[\s\S]*?"id"[\s\S]*?\](?=[^"\]]|$)/);
if(m3){try{var arr3=JSON.parse(m3[0]);if(Array.isArray(arr3)&&arr3.length>0)return arr3;}catch(e){}}
/* Last resort: find any JSON array in stringified data */
var m4=str.match(/\[\s*\{[^]*"id"[^]*\}\s*\]/);
if(m4){try{var arr4=JSON.parse(m4[0]);if(Array.isArray(arr4)&&arr4.length>0)return arr4;}catch(e){}}
}catch(e){}

}
