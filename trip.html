  ★データの形（後方互換）★
  /trip/<tripId> = { title, dates, stay, packing, memo, days:[{label, items:[...]}] }
  旅の一覧はこの直下のキーを読んで作る。最初に作った "default"（那須白河）も
  そのまま一覧に並ぶので、移行作業は要らない。
  予定の項目は { time, what } が最小形で、詳細（場所・メモ・URL・費用）は

/* 選んだテーマを画面に反映する。CSS 変数だけを差し替えるので、
   個々の要素の指定は触らずに済む。 */
function applyTheme(t){
  var w = themeOf(t);
  var r = document.documentElement.style;
  r.setProperty("--bg", w.bg || "linear-gradient(180deg,#0f1020,#0f1020)");
  r.setProperty("--card", w.card || "rgba(255,255,255,.04)");
  r.setProperty("--accent", w.accent || "#7c6cf0");
  r.setProperty("--ink", w.ink || "#e9e9f0");
  r.setProperty("--sub", w.sub || "#8087a8");
  var d = document.getElementById("deco");
  if (d) d.innerHTML = w.deco ? decodeURIComponent(w.deco.replace(/%23/g, "#")) : "";
}
/* theme は "series/work" の形で持つ。未設定・不明なら標準。 */
function themeOf(t){
  var p = String(t || "").split("/");
  var s = THEMES[p[0]];
  if (!s || !s.works || !s.works[p[1]]) return { icon:"🧳", label:"標準", marks:[] };
  var w = s.works[p[1]];
  return Object.assign({ series:s.label }, w);
}
function themeIcon(t){ return themeOf(t).icon || "🧳"; }

/* 日付は YYYY-MM-DD で持つ。new Date("2026-09-22") は UTC 解釈になって
   時差の分だけ前日にずれるので、必ず数値に割って地方時で組み立てる。 */
var WD = ["日","月","火","水","木","金","土"];
function parseDate(v){
  var m = String(v || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return null;
  var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return isNaN(d.getTime()) ? null : d;
}
function fmtDate(v){
  var d = parseDate(v);
  return d ? (d.getMonth() + 1) + "/" + d.getDate() + "(" + WD[d.getDay()] + ")" : "";
}
/* 一覧や見出しに出す表記を作る。片方だけでも出す。 */
function fmtRange(start, end){
  var a = fmtDate(start), b = fmtDate(end);
  if (a && b) return a === b ? a : a + " 〜 " + b;
  return a || b || "";
}
/* 開始日から n 日目の日付。日程の見出しを自動で埋めるのに使う。 */
function addDays(v, n){
  var d = parseDate(v);
  if (!d) return null;
  d.setDate(d.getDate() + n);
  return d;
}
/* 「2泊3日」の表記。日付を入れた実感が出るので添える。 */
function nights(start, end){
  var a = parseDate(start), b = parseDate(end);
  if (!a || !b) return "";
  var n = Math.round((b - a) / 86400000);
  if (n < 0) return "";
  return n === 0 ? "日帰り" : n + "泊" + (n + 1) + "日";
}
function dayLabel(start, i){
  var d = addDays(start, i);
  if (!d) return "";
  return (i + 1) + "日目 " + (d.getMonth() + 1) + "/" + d.getDate() + "(" + WD[d.getDay()] + ")";
}

/* 時刻は "7:30" のように保存されていることがある（自由入力だった頃の名残）。
   input type=time は "HH:MM" しか受け付けないので、読み込み時にゼロ埋めする。
   これをしないとモーダルの時刻欄が空に見える。 */
function padTime(v){
  var m = String(v == null ? "" : v).trim().match(/^(\d{1,2})[:：](\d{1,2})$/);
  if (!m) return "";
  var h = Math.min(23, Number(m[1])), mi = Math.min(59, Number(m[2]));
  return ("0" + h).slice(-2) + ":" + ("0" + mi).slice(-2);
}
/* 並び順は時刻だけで決める。手で並べ替えられるようにもしていたが、
   時刻を直すたびに手の順序と食い違って混乱するので、時刻を唯一の根拠にした。
   時刻未定は末尾。同じ時刻は元の並びを保つ（安定ソート）。 */
function sortItems(items){
  return items
    .map(function(it, i){ return { it:it, i:i, t:padTime(it.time) }; })
    .sort(function(a, b){
      if (!a.t && !b.t) return a.i - b.i;
      if (!a.t) return 1;
      if (!b.t) return -1;
      if (a.t !== b.t) return a.t < b.t ? -1 : 1;
      return a.i - b.i;
    })
    .map(function(x){ return x.it; });
}

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  document.getElementById("hrow").innerHTML = '<h1>🧳 旅のしおり</h1>';
  var main = document.getElementById("main");
  if (trips === null){ main.innerHTML = '<p style="color:#7f86a8">読み込み中…</p>'; return; }

  var keys = Object.keys(trips);
  main.innerHTML =
    keys.map(function(k){
      var t = trips[k] || {};
      var days = (t.days || []).filter(Boolean);
      var n = days.reduce(function(a,d){ return a + ((d.items||[]).filter(Boolean).length); }, 0);
      return '<div class="trip" data-id="' + esc(k) + '">' +
        '<div style="font-size:20px">' + themeIcon(t.theme) + '</div>' +
        '<div class="n"><b>' + esc(t.title || "(名前なし)") + '</b>' +
        '<span>' + esc(t.dates || "日程未定") + ' ・ ' + days.length + '日 / 予定' + n + '件' +
        (t.theme ? ' ・ ' + esc(themeOf(t.theme).label) : "") + '</span></div>' +
        '<div style="color:#5d6484">›</div></div>';
    }).join("") +
    (keys.length ? "" : '<p style="color:#7f86a8;text-align:center;padding:30px 0">まだ旅がありません</p>') +
    '<button class="addday" id="newtrip">＋ 新しい旅を作る</button>' +
    '<div class="foot">このURLを知っている人は誰でも編集できます。</div>';

  Array.prototype.forEach.call(main.querySelectorAll(".trip"), function(el){
    el.addEventListener("click", function(){ location.search = "?id=" + encodeURIComponent(el.dataset.id); });
  });
  document.getElementById("newtrip").addEventListener("click", function(){
    var name = prompt("旅の名前（例: 那須塩原・白河）");
    if (name === null) return;
    /* キーは時刻から作る。日本語をキーにすると Firebase のパスで扱いづらい。 */
    var id = "t" + Date.now();
    db.ref("trip/" + id).set({ title:name || "", dates:"", start:"", end:"", theme:"", stay:"", packing:"", memo:"", days:[] })
      .then(function(){ location.search = "?id=" + id; })
      .catch(function(e){ say("作成できませんでした: " + e.message); });
  });
}

/* ─────────── しおり本体 ─────────── */

/* dates は start/end から組み立てるので、ここには入れない。
   日付を入れる前の古いデータでは自由入力の文字列が入っているので、
   その場合は消さずにそのまま表示する。 */
var FIELDS = ["title","stay","packing","memo"];

function showTrip(){
  document.getElementById("hrow").innerHTML =
    '<button class="back" id="back" title="旅の一覧へ">‹</button>' +
    '<h1><span id="tripIcon">🧳</span> <input id="title" placeholder="旅の名前"></h1>' +
    '<button class="tbtn" id="themeBtn" title="テーマを選ぶ">🎨</button>';
  document.getElementById("back").addEventListener("click", function(){ location.search = ""; });
  document.getElementById("themeBtn").addEventListener("click", openThemePicker);

  document.getElementById("main").innerHTML =
    '<div class="sec"><label>📅 日程</label>' +
      '<div class="row2"><input type="date" id="start"><input type="date" id="end"></div>' +
      '<div id="rangeNote" class="note"></div></div>' +
    '<div class="sec"><label>🏨 宿・交通</label><textarea id="stay" placeholder="宿の名前、住所、チェックイン時刻&#10;飛行機・新幹線の便名や座席"></textarea></div>' +
    '<div id="days"></div>' +
    '<button class="addday" id="addday">＋ 日程を追加</button>' +
    '<div class="sec"><label>🎒 持ち物</label><textarea id="packing" placeholder="充電器&#10;常備薬"></textarea></div>' +
    '<div class="sec"><label>📝 メモ</label><textarea id="memo" placeholder="行きたい店、予算、やること"></textarea></div>' +
    '<div class="foot">変更は自動で保存され、相手の画面にもすぐ反映されます。<br>このURLを知っている人は誰でも編集できます。</div>';

  FIELDS.forEach(function(k){
    document.getElementById(k).addEventListener("input", function(e){
      if (applying) return;
      state[k] = e.target.value; save();
    });
  });
  ["start","end"].forEach(function(k){
    document.getElementById(k).addEventListener("change", function(e){
      if (applying) return;
      state[k] = e.target.value;
      /* 終わりが始まりより前になったら、始まりに合わせる。
         逆順のまま保存すると一覧の表記が意味を成さない。 */
      if (state.start && state.end && state.end < state.start){
        if (k === "start") state.end = state.start; else state.start = state.end;
      }
      /* 一覧や見出しに出す表記は日付から作り直す。 */
      if (state.start || state.end) state.dates = fmtRange(state.start, state.end);
      save(); render();
    });
  });
  document.getElementById("addday").addEventListener("click", function(){
    /* 開始日が分かっていれば「2日目 9/22(火)」まで埋める。
       手で直せるよう、あくまで初期値として入れるだけ。 */
    state.days.push({ label: dayLabel(state.start, state.days.length), items:[] });
    save(); render();
  });
}

function render(){
  if (!TRIP) { showList(); return; }
  applying = true;
  applyTheme(state.theme);
  var ic = document.getElementById("tripIcon");
  if (ic) ic.textContent = themeIcon(state.theme);
  paintMarks(state.theme);
  FIELDS.forEach(function(k){ setVal(document.getElementById(k), state[k]); });
  setVal(document.getElementById("start"), state.start);
  setVal(document.getElementById("end"), state.end);
  var note = document.getElementById("rangeNote");
  if (note){
    if (state.start || state.end){
      var d = nights(state.start, state.end);
      note.textContent = fmtRange(state.start, state.end) + (d ? "（" + d + "）" : "");
    } else if (state.dates){
      /* 日付を入れる前の自由入力。消さずに残して、置き換えを促す。 */
      note.textContent = "現在の表記: " + state.dates + "（日付を選ぶと置き換わります）";
    } else {
      note.textContent = "";
    }
  }

  var wrap = document.getElementById("days");
  if (!wrap) { applying = false; return; }
  /* 件数が変わったときだけ組み立て直す。毎回作り直すと入力欄が
     入れ替わってカーソルが飛ぶ。 */
  if (wrap.childElementCount !== state.days.length) wrap.innerHTML = "";

  state.days.forEach(function(day, di){
    var box = wrap.children[di];
    if (!box){
      box = document.createElement("div");
      box.className = "day";
      box.innerHTML =
        '<div class="dayhead"><input class="dlabel" placeholder="1日目 11/22(土)">' +
        '<button class="x" title="この日を削除">🗑</button></div>' +
        '<div class="items"></div>' +
        '<button class="add">＋ 予定を追加</button>';
      wrap.appendChild(box);
      box.querySelector(".dlabel").addEventListener("input", function(e){
        if (applying) return;
        state.days[di].label = e.target.value; save();
      });
      box.querySelector(".dayhead .x").addEventListener("click", function(){
        if (!confirm("この日をまるごと削除しますか？")) return;
        state.days.splice(di,1); save(); render();
      });
      box.querySelector(".add").addEventListener("click", function(){
        /* 時刻が空の予定は末尾に並ぶので、そのまま最後の index を開けばよい。 */
        state.days[di].items.push({ time:"", what:"" }); save(); render();
        openModal(di, state.days[di].items.length - 1);
      });
    }
    setVal(box.querySelector(".dlabel"), day.label);
    renderItems(box.querySelector(".items"), di, day.items);
  });
  applying = false;
}

function renderItems(list, di, items){
  list.innerHTML = "";
  items.forEach(function(it, ii){
    var row = document.createElement("div");
    row.className = "item";
    row.dataset.di = di; row.dataset.ii = ii;
    var tags = [];
    if (it.place) tags.push("📍" + it.place);
    if (it.cost)  tags.push("💰" + it.cost);
    if (it.url)   tags.push("🔗リンク");
    if (it.memo)  tags.push("📝メモ");
    row.innerHTML =
      '<div class="no">' + (ii + 1) + '</div>' +
      '<div class="body">' +
        '<div class="t">' + (it.time ? esc(it.time) : "時刻未定") + '</div>' +
        '<div class="w' + (it.what ? "" : " empty") + '">' + esc(it.what || "（内容なし・タップで編集）") + '</div>' +
        (tags.length ? '<div class="tags">' + tags.map(esc).join("") + '</div>' : "") +
      '</div>' +
      '<button class="x" title="削除">✕</button>';
    row.querySelector(".body").addEventListener("click", function(){ openModal(di, ii); });
    row.querySelector(".x").addEventListener("click", function(e){
      e.stopPropagation();
      state.days[di].items.splice(ii,1); save(); render();
    });
    list.appendChild(row);
  });
}

/* ─────────── 予定の詳細モーダル ─────────── */

function openModal(di, ii){
  var it = (state.days[di] && state.days[di].items[ii]) || null;
  if (!it) return;
  openItem = { di:di, ii:ii };
  var root = document.getElementById("modalRoot");
  root.innerHTML =
    '<div class="mask" id="mask"><div class="modal">' +
      '<h2>予定の詳細</h2>' +
      '<div class="row2">' +
        '<div class="sec" style="max-width:160px"><label>🕐 時刻</label>' +
          '<input type="time" id="m_time" step="300"></div>' +
        '<div class="sec"><label>💰 費用</label><input id="m_cost" placeholder="例: 2,000円"></div>' +
      '</div>' +
      '<div class="sec"><label>✏️ 内容</label><input id="m_what" placeholder="何をする？"></div>' +
      '<div class="sec"><label>📍 場所</label><input id="m_place" placeholder="店名・住所"></div>' +
      '<div class="sec"><label>🔗 URL</label><input id="m_url" placeholder="https://"></div>' +
      '<div class="sec"><label>📝 メモ</label><textarea id="m_memo" placeholder="予約番号、持ち物、注意点"></textarea></div>' +
      '<div id="m_link"></div>' +
      '<div class="btns">' +
        '<button class="del" id="m_del">削除</button>' +
        '<button class="pri" id="m_ok">閉じる</button>' +
      '</div>' +
    '</div></div>';

  document.getElementById("m_time").value = it.time || "";
  document.getElementById("m_what").value = it.what || "";
  document.getElementById("m_place").value = it.place || "";
  document.getElementById("m_url").value = it.url || "";
  document.getElementById("m_cost").value = it.cost || "";
  document.getElementById("m_memo").value = it.memo || "";
  showLink(it.url);

  [["m_time","time"],["m_what","what"],["m_place","place"],["m_url","url"],
   ["m_cost","cost"],["m_memo","memo"]].forEach(function(p){
    document.getElementById(p[0]).addEventListener("input", function(e){
      var cur = state.days[di] && state.days[di].items[ii];
      if (!cur) return;
      cur[p[1]] = e.target.value;
      if (p[1] === "url") showLink(e.target.value);
      save(); renderOnlyRow(di, ii);
    });
  });
  document.getElementById("m_del").addEventListener("click", function(){
    if (!confirm("この予定を削除しますか？")) return;
    state.days[di].items.splice(ii,1); save(); closeModal(); render();
  });
  document.getElementById("m_ok").addEventListener("click", closeModal);
  document.getElementById("mask").addEventListener("click", function(e){
    if (e.target.id === "mask") closeModal();
  });
}
function showLink(url){
  var box = document.getElementById("m_link");
  if (!box) return;
  box.innerHTML = /^https?:\/\//i.test(url || "")
    ? '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer" ' +
      'style="color:#82B1FF;font-size:12px;text-decoration:none">🔗 開く</a>' : "";
}
/* 閉じるときに時刻順へ並べ替える。
   編集の途中で並べ替えると、掴んでいる行の位置（ii）がずれて
   別の予定を書き換えてしまう。だから「登録＝閉じる」の瞬間だけ行う。 */
function closeModal(){
  var di = openItem ? openItem.di : -1;
  openItem = null;
  document.getElementById("modalRoot").innerHTML = "";
  if (di >= 0 && state.days[di]){
    state.days[di].items = sortItems(state.days[di].items);
    /* 無条件に保存する。「順序が変わったか」で判定すると、受信側で
       既に並べ替え済みになっている場合に保存が走らず、DB の順序だけが
       古いまま残る（実際にそうなった）。 */
    save();
    render();
  }
}

/* モーダルで打っている間に全体を render すると入力欄が作り直されて
   カーソルが飛ぶ。一覧側はその行の表示だけ更新する。 */
function renderOnlyRow(di, ii){
  var wrap = document.getElementById("days");
  if (!wrap || !wrap.children[di]) return;
  renderItems(wrap.children[di].querySelector(".items"), di, state.days[di].items);
}

/* ─────────── テーマの選択 ─────────── */

/* 背景にモチーフを薄く散らす。画像を使わず絵文字を置くだけなので
   素材の持ち込みが要らず、テーマごとの雰囲気だけを足せる。 */
function paintMarks(t){
  var box = document.getElementById("marks");
  if (!box) return;
  var marks = themeOf(t).marks || [];
  if (!marks.length){ box.innerHTML = ""; return; }
  var html = "";
  for (var i = 0; i < 14; i++){
    var m = marks[i % marks.length];
    /* 位置は決め打ちにする。乱数だと描き直すたびに動いて落ち着かない。 */
    var top = (i * 37 % 92) + 3, left = (i * 61 % 90) + 3, rot = (i * 47 % 40) - 20;
    html += '<span style="top:' + top + '%;left:' + left + '%;transform:rotate(' + rot + 'deg)">' + m + '</span>';
  }
  box.innerHTML = html;
}

function openThemePicker(){
  var cur = state.theme || "";
  var body = "";
  Object.keys(THEMES).forEach(function(sk){
    var series = THEMES[sk];
    if (!series.works || !Object.keys(series.works).length) return;
    body += '<div class="sec"><label>' + series.icon + ' ' + esc(series.label) + '</label><div class="tgrid">';
    Object.keys(series.works).forEach(function(wk){
      var w = series.works[wk], key = sk + "/" + wk;
      body += '<button class="tcard' + (cur === key ? " on" : "") + '" data-k="' + key + '">' +
why(w) + '<b>' + esc(w.label) + '</b><span>' + esc(series.label) + '</span></button>';
    });
    body += '</div></div>';
  });
  function why(w){
    return '<div style="font-size:22px">' + w.icon + '</div>' +
      '<div class="sw"><i style="background:' + w.accent + '"></i>' +
      '<i style="background:' + w.card.replace(/[\d.]+\)$/, "1)") + '"></i>' +
      '<i style="background:' + w.ink + '"></i></div>';
  }

  document.getElementById("modalRoot").innerHTML =
    '<div class="mask" id="tmask"><div class="modal">' +
      '<h2>🎨 テーマを選ぶ</h2>' +
      '<div class="sec"><label>標準</label><div class="tgrid">' +
        '<button class="tcard' + (cur ? "" : " on") + '" data-k="">' +
        '<div style="font-size:22px">🧳</div><b>標準</b><span>飾りなし</span></button>' +
      '</div></div>' +
      body +
      '<div class="btns"><button class="pri" id="tclose">閉じる</button></div>' +
    '</div></div>';

  Array.prototype.forEach.call(document.querySelectorAll(".tcard"), function(el){
    el.addEventListener("click", function(){
      state.theme = el.dataset.k;
      save(); render();
      /* 選んだ結果をその場で見せたいので、開いたまま印だけ付け替える。 */
      Array.prototype.forEach.call(document.querySelectorAll(".tcard"), function(o){
        o.classList.toggle("on", o.dataset.k === state.theme);
      });
    });
  });
  document.getElementById("tclose").addEventListener("click", closeTheme);
  document.getElementById("tmask").addEventListener("click", function(e){
    if (e.target.id === "tmask") closeTheme();
  });
}
function closeTheme(){ document.getElementById("modalRoot").innerHTML = ""; }

/* ─────────── 保存と同期 ─────────── */

var timer = null;
function save(){
  if (!ref) return;
  clearTimeout(timer);
  say("保存中…");
  timer = setTimeout(function(){
    ref.set(state)
      .then(function(){ say("✓ 保存しました", true); })
      .catch(function(e){ say("保存できませんでした: " + e.message); });
  }, 400);
}

/* sort=false のときは並べ替えない。
   モーダルを開いている間に順序が変わると、掴んでいる行の位置（ii）が
   ずれて別の予定を書き換えてしまう。編集中は届いた順のまま保持する。 */
function normalize(v, sort){
  var s = { title:"", dates:"", start:"", end:"", theme:"", stay:"", packing:"", memo:"", days:[] };
  if (!v) return s;
  FIELDS.forEach(function(k){ s[k] = v[k] || ""; });
  s.start = v.start || ""; s.end = v.end || ""; s.dates = v.dates || ""; s.theme = v.theme || "";
  /* Firebase は空配列を落とすので、無ければ空配列に戻す。 */
  s.days = (v.days || []).filter(Boolean).map(function(d){
    var items = (d.items || []).filter(Boolean).map(function(it){
      return Object.assign({}, it, { time: padTime(it.time) });
    });
    return { label: d.label || "", items: sort === false ? items : sortItems(items) };
  });
  return s;
}

if (TRIP){
  showTrip();
  ref = db.ref("trip/" + TRIP);
  ref.on("value", function(snap){
    state = normalize(snap.val(), !openItem);
    render();
    say("接続中 ✓", true);
  }, function(e){ say("読み込めませんでした: " + e.message); });
} else {
  db.ref("trip").on("value", function(snap){
    trips = snap.val() || {};
    showList();
    say("接続中 ✓", true);
  }, function(e){ say("読み込めませんでした: " + e.message); });
}
</script>
