<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BubblesNow</title>
<style>body{background:#0f0c29;color:#fff;font-family:-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;padding:20px}.w{max-width:340px}.s{width:22px;height:22px;border:2px solid rgba(255,255,255,.15);border-top-color:#845EF7;border-radius:50%;animation:s .5s linear infinite;margin:0 auto 10px}@keyframes s{to{transform:rotate(360deg)}}.ok{font-size:48px;margin-bottom:10px}.nm{font-size:16px;font-weight:700;margin-bottom:6px}.t{font-size:11px;color:rgba(255,255,255,.4);line-height:1.8}.tag{display:inline-block;padding:2px 8px;border-radius:8px;margin:2px;font-size:10px}.c1{background:rgba(132,94,247,.15);color:#b794f6}.c2{background:rgba(255,212,59,.15);color:#ffd43b}.c3{background:rgba(255,169,77,.15);color:#ffa94d}</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
</head>
<body><div class="w" id="m"><div class="s"></div><div style="font-size:14px">タスク追加中...</div></div>
<script>
"use strict";
/* add.html の Make.com webhook 依存をなくし、Firebase に直接書き込む版。
   クエリの受け口は add.html と同一なので、iOSショートカット等は URL を
   add.html → add-direct.html に差し替えるだけで移行できる。

   ★認証が要るようになった★
   DB を認証必須に締めるので、ここも Google サインイン済みでないと書けない。
   ただしこのページは iOS ショートカットから開かれる。毎回サインインを
   求めては使い物にならないので、本体アプリでサインイン済みのセッションを
   そのまま使う（Firebase Auth は同じオリジンに保存される）。
   未サインインのときだけボタンを出す。

   Auth を使うので databaseURL だけでなく apiKey / authDomain も要る。
   apiKey は秘密ではなく、どのプロジェクトかを示す識別子。
   守るのはルール側の uid 照合であって、この値ではない。 */
firebase.initializeApp({
  apiKey:"AIzaSyBvWy2zxQRazmGJWU0-NEaw2wxxpb1WkJU",
  authDomain:"nydaytodo-e0f20.firebaseapp.com",
  databaseURL:"https://nydaytodo-e0f20-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"nydaytodo-e0f20"
});
var db=firebase.database();

var p=Object.fromEntries(new URLSearchParams(location.search));
var fields=["name","category","priority","icon","deadline","detail","merit","demerit","url","note","location","status"];
var data={};
fields.forEach(function(f){data[f]=p[f]||"";});
if(!data.status)data.status="active";
if(!data.category)data.category="その他";
if(!data.priority)data.priority="🟡中";

var el=document.getElementById("m");

/* 表示は innerHTML で組み立てるので、URLから来た値はエスケープしてから差し込む。
   add.html がここへ転送するようになり、タスク追加はすべてこのファイルを通るため、
   タスク名に < > が入っているだけで表示が崩れる状態は塞いでおく。 */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

function showSignIn(msg){
  el.innerHTML='<div style="font-size:40px;margin-bottom:12px">🔒</div>'+
    '<div style="font-size:14px;margin-bottom:6px">ログインが必要です</div>'+
    (msg?'<div class="t" style="margin-bottom:12px">'+esc(msg)+'</div>':'')+
    '<button id="si" style="padding:12px 20px;border-radius:10px;border:none;background:#fff;color:#1f1f1f;font-size:14px;font-weight:600">Google でログイン</button>'+
    '<div class="t" style="margin-top:14px">ログイン後、このタスクの追加は自動で続きます</div>';
  document.getElementById("si").onclick=function(){
    /* ショートカットから開かれるのでリダイレクト方式に倒す。
       戻ってきたときクエリは保持されるので、そのまま追加処理へ進む。 */
    firebase.auth().signInWithRedirect(new firebase.auth.GoogleAuthProvider());
  };
}

function run(){
if(!data.name){
  el.innerHTML="⚠️ タスク名がありません";
}else{
  var task={
    id:"t"+Date.now(),
    name:data.name,
    category:data.category,
    detail:data.detail,
    merit:data.merit,
    demerit:data.demerit,
    deadline:data.deadline,
    priority:data.priority,
    status:data.status,
    url:data.url,
    note:data.note,
    icon:data.icon,
    location:data.location,
    wip:false,
    createdAt:new Date().toISOString()
  };

  /* ★ transaction を使う理由 ★
     アプリ本体は tasks 配列を丸ごと .set() で上書きする。単純な get→set だと
     同時操作で片方の更新が消える（ロストアップデート）。transaction なら
     サーバ側の最新値を元に再試行されるので、取りこぼしが起きない。 */
  db.ref("users/yokota/tasks").transaction(function(current){
    var arr=Array.isArray(current)?current.slice():(current?Object.values(current):[]);
    arr.push(task);
    return arr;
  },function(err,committed){
    if(err||!committed){
      el.innerHTML="❌ エラー — リロードしてください"+(err?"<div class='t'>"+esc(err.message)+"</div>":"");
      return;
    }
    el.innerHTML=
      '<div class="ok">✅</div>'+
      '<div class="nm">'+(task.icon?esc(task.icon)+' ':'')+esc(task.name)+'</div>'+
      '<div class="t">'+
      (task.category?'<span class="tag c1">'+esc(task.category)+'</span>':'')+
      (task.priority?'<span class="tag c2">'+esc(task.priority)+'</span>':'')+
      (task.deadline?'<span class="tag c3">'+esc(task.deadline)+'</span>':'')+
      (task.detail?'<br>'+esc(task.detail):'')+
      '</div>'+
      '<div style="margin-top:16px;font-size:12px;color:rgba(255,255,255,.3)">このページを閉じてOKです</div>';
  });
}
}

/* サインイン状態が確定してから動かす。確定前に書くと権限エラーになる。 */
firebase.auth().getRedirectResult().catch(function(e){showSignIn(e.message||String(e));});
firebase.auth().onAuthStateChanged(function(user){
  if(user)run();
  else showSignIn("");
});
</script></body></html>
